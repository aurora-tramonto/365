(function () {
  var r = document.documentElement;

  function momento() {
    var h = new Date().getHours();
    var adesso = h >= 4 && h < 11 ? 'dawn' : (h >= 11 && h < 17 ? 'noon' : 'dusk');
    if (r.getAttribute('data-ora') !== adesso) r.setAttribute('data-ora', adesso);
  }

  setTimeout(momento, 400);
  setTimeout(momento, 1500);

  /* 2 — la percentuale nell'anello (aggiorna solo quando cambia) */
  var visto = null;
  function anello() {
